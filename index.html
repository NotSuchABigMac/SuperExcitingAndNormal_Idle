<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.E.A.N. Protocol: Fountain Edition</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-panel: #1e293b;
            --primary: #38bdf8;
            --accent: #818cf8;
            --gold: #fbbf24;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; user-select: none; }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- PARTICLES --- */
        #particle-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999; /* On top of everything */
        }
        
        .mini-sean {
            position: absolute;
            width: 30px; height: 30px;
            border-radius: 50%;
            object-fit: cover;
            will-change: transform, opacity;
        }

        /* --- HERO ANIMATION --- */
        #hero-sean {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 300px; height: 300px;
            border-radius: 50%;
            border: 8px solid var(--gold);
            box-shadow: 0 0 50px var(--gold);
            z-index: 5000;
            display: none;
            object-fit: cover;
        }

        /* --- NOTIFICATIONS --- */
        #toast-container {
            position: fixed; bottom: 20px; right: 20px; z-index: 10000;
            display: flex; flex-direction: column; gap: 10px;
        }

        .toast {
            background: var(--bg-panel);
            border-left: 4px solid var(--gold);
            padding: 15px 20px;
            border-radius: 4px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            animation: slideIn 0.5s ease-out;
            min-width: 250px;
        }
        .toast h4 { margin: 0 0 5px 0; color: var(--gold); font-size: 0.9rem; }
        .toast p { margin: 0; font-size: 0.8rem; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }

        /* --- UTILITY --- */
        .hidden { display: none !important; opacity: 0; }
        .fade-in { animation: fadeIn 1s forwards; }
        .shake-screen { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        /* --- STAGE 1: THE ARTIFACT --- */
        #artifact-stage { text-align: center; cursor: pointer; transition: transform 0.05s; z-index: 10; }
        .artifact {
            width: 180px; height: 240px;
            background: radial-gradient(circle at 30% 30%, #e2e8f0, #cbd5e1);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto; position: relative; border: 1px solid #94a3b8;
        }
        .artifact::after {
            content: "PROJECT: NORMAL"; font-size: 0.7rem; color: #64748b;
            font-family: monospace; letter-spacing: 2px; position: absolute; bottom: 40px;
        }

        /* --- STAGE 2: DASHBOARD --- */
        #dashboard-stage {
            width: 96vw; max-width: 1200px; height: 90vh;
            display: grid; grid-template-columns: 280px 1fr 280px;
            gap: 20px; padding: 0; opacity: 0; /* Hidden initially for fade in */
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: flex; flex-direction: column;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            overflow: hidden; height: 100%;
        }

        .col-left { text-align: center; align-items: center; }
        
        .sean-avatar {
            width: 150px; height: 150px;
            border-radius: 50%; border: 4px solid var(--primary);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            cursor: pointer; transition: transform 0.1s;
            object-fit: cover; margin-top: 20px;
            position: relative; z-index: 5;
        }
        .sean-avatar:active { transform: scale(0.90); }

        .currency { font-size: 2rem; font-weight: 800; color: var(--text-main); margin-top: 20px; }
        .rate { color: var(--primary); font-family: monospace; font-size: 1.1rem; }
        
        .prestige-box {
            margin-top: auto; width: 100%;
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid var(--gold);
            padding: 10px; border-radius: 8px;
        }
        .prestige-btn {
            background: var(--gold); color: #000; width: 100%;
            border: none; padding: 8px; border-radius: 4px;
            font-weight: bold; cursor: pointer; margin-top: 5px;
        }

        .scroll-list { overflow-y: auto; padding-right: 5px; flex-grow: 1; }
        .scroll-list::-webkit-scrollbar { width: 4px; }
        .scroll-list::-webkit-scrollbar-thumb { background: var(--border); }

        .card {
            background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border);
            padding: 12px; margin-bottom: 10px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .ach-card { opacity: 0.5; filter: grayscale(1); }
        .ach-card.unlocked { opacity: 1; filter: grayscale(0); border-color: var(--gold); }

        .btn-buy {
            background: var(--primary); color: var(--bg-dark);
            border: none; padding: 8px 12px; border-radius: 6px;
            font-weight: 700; cursor: pointer; min-width: 80px;
        }
        .btn-buy:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

        @media (max-width: 1100px) {
            body { overflow-y: auto; height: auto; padding: 40px 0; }
            #dashboard-stage { 
                grid-template-columns: 1fr; grid-template-rows: auto auto auto;
                height: auto; width: 90vw; display: flex; flex-direction: column;
            }
            .col-left, .col-mid, .col-right { height: auto; max-height: 500px; }
        }
    </style>
</head>
<body>

    <div id="particle-layer"></div>
    <div id="toast-container"></div>
    <img src="sean.png" id="hero-sean">

    <div id="artifact-stage" onclick="game.clickArtifact(event)">
        <div class="artifact"></div>
        <p style="color: var(--text-muted); margin-top: 20px;">Initializing...</p>
    </div>

    <div id="dashboard-stage">
        <div class="panel col-left">
            <h2 style="letter-spacing: 2px; font-weight: 300; margin: 0;">S.E.A.N. Idle</h2>
            <img src="sean.png" class="sean-avatar" id="main-avatar" style="opacity:0" onclick="game.clickSean(event)" draggable="false">
            
            <div class="currency" id="ui-currency">0</div>
            <div style="font-size: 0.8rem; color: var(--text-muted);">SEANS</div>
            <div class="rate" id="ui-rate">0.0 / sec</div>

            <div class="prestige-box" id="prestige-ui">
                <div style="font-size: 0.8em; color: var(--gold); font-weight: bold;">CORE MEMORIES: <span id="ui-prestige-lvl">0</span></div>
                <div style="font-size: 0.7em;">+<span id="ui-prestige-mult">0</span>% Bonus</div>
                <button class="prestige-btn" onclick="game.tryPrestige()">SINGULARITY (Reset)</button>
            </div>
        </div>

        <div class="panel col-mid">
            <h3 style="border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-top: 0;">Infrastructure</h3>
            <div class="scroll-list" id="ui-upgrades"></div>
        </div>

        <div class="panel col-right">
            <h3 style="border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-top: 0;">Achievements</h3>
            <div class="scroll-list" id="ui-achievements"></div>
            <div style="margin-top: 10px; text-align: center;">
                 <button onclick="game.hardReset()" style="background: transparent; border: 1px solid #ef4444; color: #ef4444; font-size: 0.7rem; padding: 4px; cursor: pointer;">WIPE SAVE</button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            eggClicksRequired: 10,
            tickRate: 100,
            saveKey: 'sean_idle_fountain_v2',
            prestigeBase: 5000
        };

        const UPGRADES = [
            { name: "Local Area Sean", desc: "Basic LAN connection.", baseCost: 15, production: 1 },
            { name: "Sean Clone", desc: "Biological replica.", baseCost: 100, production: 5 },
            { name: "Sean Server", desc: "Dedicated hardware.", baseCost: 1100, production: 12 },
            { name: "SeanGPT", desc: "Large Language Sean.", baseCost: 12000, production: 45 },
            { name: "Quantum Sean", desc: "Superposition friendship.", baseCost: 130000, production: 150 },
            { name: "Galactic Sean", desc: "Dyson Sphere of Seans.", baseCost: 1400000, production: 600 }
        ];

        const ACHIEVEMENTS = [
            { id: 'first_click', name: "First Contact", desc: "Click Sean once.", condition: (s) => s.lifetimeCurrency >= 1 },
            { id: '1k_club', name: "1k Club", desc: "Reach 1,000 Lifetime Seans.", condition: (s) => s.lifetimeCurrency >= 1000 },
            { id: 'automation', name: "Automator", desc: "Reach 100 SPS.", condition: (s, game) => game.getSPS() >= 100 },
            { id: 'millionaire', name: "Seanillionaire", desc: "1 Million Lifetime.", condition: (s) => s.lifetimeCurrency >= 1000000 },
            { id: 'prestige_1', name: "Reborn", desc: "Prestige for the first time.", condition: (s) => s.prestigeLevel >= 1 },
        ];

        class Game {
            constructor() {
                this.state = {
                    eggClicks: 0,
                    unlocked: false,
                    currency: 0,
                    lifetimeCurrency: 0,
                    prestigeLevel: 0,
                    upgrades: Array(UPGRADES.length).fill(0),
                    achievements: [],
                    startTime: Date.now()
                };

                this.load();
                this.initUI();
                
                setInterval(() => this.tick(), CONFIG.tickRate);
                setInterval(() => this.save(), 5000);
                
                // Faster visual loop for smoother fountain
                setInterval(() => this.passiveVisuals(), 100); 
            }

            // --- CALCULATIONS ---
            getPrestigeBonus() { return 1 + (this.state.prestigeLevel * 0.10); }
            getSPS() {
                let rawSPS = this.state.upgrades.reduce((total, count, index) => total + (count * UPGRADES[index].production), 0);
                return rawSPS * this.getPrestigeBonus();
            }
            getUpgradeCost(index) {
                return Math.floor(UPGRADES[index].baseCost * Math.pow(1.15, this.state.upgrades[index]));
            }

            // --- INTERACTIONS ---
            clickArtifact(e) {
                this.state.eggClicks++;
                const el = document.querySelector('.artifact');
                el.style.transform = `scale(0.95) rotate(${Math.random() * 10 - 5}deg)`;
                setTimeout(() => el.style.transform = 'scale(1) rotate(0deg)', 50);

                if (this.state.eggClicks >= CONFIG.eggClicksRequired) {
                    this.state.unlocked = true;
                    this.save();
                    this.triggerHatchSequence();
                }
            }

            clickSean(e) {
                const amount = 1 * this.getPrestigeBonus();
                this.addCurrency(amount);
                this.spawnParticles(e.clientX, e.clientY, 3, true); // Burst on click
            }

            triggerHatchSequence() {
                const egg = document.getElementById('artifact-stage');
                const dashboard = document.getElementById('dashboard-stage');
                const hero = document.getElementById('hero-sean');
                
                // 1. Egg Explosion
                const rect = egg.getBoundingClientRect();
                const centerX = rect.left + rect.width/2;
                const centerY = rect.top + rect.height/2;
                this.spawnParticles(centerX, centerY, 50, true); // BIG explosion
                egg.classList.add('hidden');

                // 2. Hero Appears
                hero.style.display = 'block';
                hero.animate([
                    { transform: 'translate(-50%, -50%) scale(0)' },
                    { transform: 'translate(-50%, -50%) scale(1.5)' }
                ], { duration: 600, easing: 'cubic-bezier(0.175, 0.885, 0.32, 1.275)', fill: 'forwards' });

                // 3. Pause, then Fly to slot
                setTimeout(() => {
                    // Reveal dashboard (but keep avatar hidden)
                    dashboard.style.display = 'grid'; // ensure it's calculated
                    dashboard.classList.add('fade-in');
                    
                    const target = document.getElementById('main-avatar');
                    const tRect = target.getBoundingClientRect();
                    const startX = window.innerWidth / 2;
                    const startY = window.innerHeight / 2;
                    const endX = tRect.left + tRect.width / 2;
                    const endY = tRect.top + tRect.height / 2;

                    // Animate Hero movement
                    const anim = hero.animate([
                        { transform: 'translate(-50%, -50%) scale(1.5)', top: '50%', left: '50%' },
                        { transform: 'translate(-50%, -50%) scale(1)', top: `${endY}px`, left: `${endX}px` }
                    ], { duration: 800, easing: 'ease-in-out', fill: 'forwards' });

                    anim.onfinish = () => {
                        hero.style.display = 'none';
                        target.style.opacity = '1';
                        // Shake screen on impact
                        document.body.classList.add('shake-screen');
                        this.spawnParticles(endX, endY, 20, true); // Impact dust
                        setTimeout(() => document.body.classList.remove('shake-screen'), 500);
                    };

                }, 1500);
            }

            // --- PARTICLES (THE FOUNTAIN) ---
            spawnParticles(x, y, count, isExplosion) {
                const container = document.getElementById('particle-layer');
                const maxParticles = 300; // Perf cap
                if (container.children.length > maxParticles) return;

                for(let i=0; i<count; i++) {
                    const img = document.createElement('img');
                    img.src = 'sean.png';
                    img.className = 'mini-sean';
                    
                    // Center origin
                    img.style.left = (x - 15) + 'px';
                    img.style.top = (y - 15) + 'px';
                    container.appendChild(img);

                    // FOUNTAIN PHYSICS
                    // High upward velocity (negative Y)
                    // Wide X spread
                    const spread = isExplosion ? 20 : 10;
                    const upForce = isExplosion ? 25 : 15;
                    
                    let velocityX = (Math.random() - 0.5) * spread; 
                    let velocityY = -(Math.random() * 10) - 10; // Minimum lift
                    if (isExplosion) velocityY -= 10; // Extra pop for explosions

                    let posX = x;
                    let posY = y;
                    let rotation = Math.random() * 360;
                    let rotSpeed = (Math.random() - 0.5) * 20;
                    let opacity = 1;

                    const anim = setInterval(() => {
                        velocityY += 0.8; // Gravity
                        posX += velocityX;
                        posY += velocityY;
                        rotation += rotSpeed;
                        
                        // Fade out near end or if falling too far
                        if (velocityY > 0) opacity -= 0.015;

                        img.style.transform = `translate(${posX - x}px, ${posY - y}px) rotate(${rotation}deg)`;
                        img.style.opacity = opacity;

                        if (opacity <= 0 || posY > window.innerHeight + 50) {
                            clearInterval(anim);
                            img.remove();
                        }
                    }, 20);
                }
            }

            passiveVisuals() {
                if(!this.state.unlocked) return;
                const sps = this.getSPS();
                if (sps < 1) return;

                // Scale particle count with SPS for "Fountain" effect
                // Cap it so we don't crash the browser at endgame
                let count = Math.min(Math.ceil(sps / 8), 5); 
                
                const avatar = document.getElementById('main-avatar');
                if(avatar && avatar.offsetParent !== null) { // Visible check
                    const rect = avatar.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    // False = use fountain physics, not explosion physics
                    this.spawnParticles(centerX, centerY, count, false);
                }
            }

            // --- UI & LOGIC ---
            buyUpgrade(index) {
                const cost = this.getUpgradeCost(index);
                if (this.state.currency >= cost) {
                    this.state.currency -= cost;
                    this.state.upgrades[index]++;
                    this.updateUI();
                }
            }

            tryPrestige() {
                const potential = Math.floor(Math.cbrt(this.state.lifetimeCurrency / CONFIG.prestigeBase));
                if (potential > this.state.prestigeLevel) {
                    const gain = potential - this.state.prestigeLevel;
                    if(confirm(`Singularity Reset!\n\nReset everything to gain ${gain} Core Memories (+${gain * 10}% Bonus).`)) {
                        this.state.prestigeLevel = potential;
                        this.state.currency = 0;
                        this.state.upgrades = Array(UPGRADES.length).fill(0);
                        this.state.unlocked = false; // Relock to see the cool animation again!
                        this.state.eggClicks = 0;
                        this.save();
                        location.reload();
                    }
                } else {
                    alert(`Not enough energy. Need more Seans.`);
                }
            }

            tick() {
                if (!this.state.unlocked) return;
                const earned = this.getSPS() / (1000 / CONFIG.tickRate);
                if (earned > 0) this.addCurrency(earned);
                this.checkAchievements();
            }

            addCurrency(amt) {
                this.state.currency += amt;
                this.state.lifetimeCurrency += amt;
                this.updateUI();
            }

            checkAchievements() {
                ACHIEVEMENTS.forEach(ach => {
                    if (!this.state.achievements.includes(ach.id)) {
                        if (ach.condition(this.state, this)) {
                            this.state.achievements.push(ach.id);
                            this.showToast(ach.name, ach.desc);
                            this.renderAchievements();
                        }
                    }
                });
            }

            showToast(title, msg) {
                const con = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = `<h4>🏆 Unlocked!</h4><p><strong>${title}</strong><br>${msg}</p>`;
                con.appendChild(toast);
                setTimeout(() => toast.remove(), 4000);
            }

            initUI() {
                const uList = document.getElementById('ui-upgrades');
                uList.innerHTML = '';
                UPGRADES.forEach((u, i) => {
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `
                        <div>
                            <div style="font-weight:bold">${u.name}</div>
                            <div style="font-size:0.8em; color:var(--text-muted)">${u.desc}</div>
                            <div style="font-size:0.7em; color:var(--accent)">+${u.production} SPS</div>
                        </div>
                        <button class="btn-buy" id="btn-buy-${i}" onclick="game.buyUpgrade(${i})">Cost</button>
                    `;
                    uList.appendChild(div);
                });
                this.renderAchievements();

                // If already unlocked, skip animation
                if (this.state.unlocked) {
                    document.getElementById('artifact-stage').classList.add('hidden');
                    const dash = document.getElementById('dashboard-stage');
                    dash.style.opacity = '1';
                    document.getElementById('main-avatar').style.opacity = '1';
                }
            }

            renderAchievements() {
                const aList = document.getElementById('ui-achievements');
                aList.innerHTML = '';
                ACHIEVEMENTS.forEach(ach => {
                    const unlocked = this.state.achievements.includes(ach.id);
                    const div = document.createElement('div');
                    div.className = `card ach-card ${unlocked ? 'unlocked' : ''}`;
                    div.innerHTML = `
                        <div style="font-size:1.2rem; margin-right:10px">${unlocked ? '🏆' : '🔒'}</div>
                        <div>
                            <div style="font-weight:bold; font-size:0.9rem">${ach.name}</div>
                            <div style="font-size:0.75rem; color:var(--text-muted)">${ach.desc}</div>
                        </div>
                    `;
                    aList.appendChild(div);
                });
            }

            updateUI() {
                if (!this.state.unlocked) return;
                document.getElementById('ui-currency').innerText = Math.floor(this.state.currency).toLocaleString();
                document.getElementById('ui-rate').innerText = `${this.getSPS().toFixed(1)} Seans/sec`;
                document.getElementById('ui-prestige-lvl').innerText = this.state.prestigeLevel;
                document.getElementById('ui-prestige-mult').innerText = Math.round((this.getPrestigeBonus() - 1) * 100);

                UPGRADES.forEach((u, i) => {
                    const btn = document.getElementById(`btn-buy-${i}`);
                    const cost = this.getUpgradeCost(i);
                    btn.innerHTML = `<div>${cost.toLocaleString()}</div><div style="font-size:0.7em; opacity:0.8">Lvl ${this.state.upgrades[i]}</div>`;
                    btn.disabled = this.state.currency < cost;
                    btn.style.opacity = this.state.currency < cost ? 0.5 : 1;
                });
            }

            save() { localStorage.setItem(CONFIG.saveKey, JSON.stringify(this.state)); }
            load() {
                const data = localStorage.getItem(CONFIG.saveKey);
                if (data) this.state = { ...this.state, ...JSON.parse(data) };
            }
            hardReset() {
                if(confirm("Wipe Save?")) { localStorage.removeItem(CONFIG.saveKey); location.reload(); }
            }
        }

        const game = new Game();
    </script>
</body>
</html>
