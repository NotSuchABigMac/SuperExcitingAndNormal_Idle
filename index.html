<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sean-as-a-Service: Enterprise Idle</title>
    <style>
        :root { --primary: #00d4ff; --bg: #0a0b10; --card: #161b22; --accent: #58a6ff; }
        body { background: var(--bg); color: #c9d1d9; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        #top-bar { width: 100%; background: #010409; padding: 15px; text-align: center; border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 10; }
        .currency-main { font-size: 2.5rem; color: var(--primary); font-weight: bold; margin: 5px 0; }
        .stats-bar { font-size: 0.9rem; color: #8b949e; }
        
        #game-container { display: flex; gap: 20px; padding: 20px; max-width: 1000px; width: 100%; }
        #click-zone { flex: 1; text-align: center; background: var(--card); padding: 40px; border-radius: 15px; border: 1px solid #30363d; height: fit-content; }
        #shop-zone { flex: 1.5; }

        .sean-node { width: 180px; height: 180px; border-radius: 50%; border: 4px solid var(--primary); cursor: pointer; transition: 0.1s; box-shadow: 0 0 20px rgba(0,212,255,0.2); }
        .sean-node:active { transform: scale(0.92); filter: brightness(1.2); }

        .upgrade-card { background: var(--card); border: 1px solid #30363d; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
        .upgrade-card:hover:not(.disabled) { border-color: var(--accent); }
        .info { flex-grow: 1; }
        .name { color: var(--accent); font-weight: bold; display: block; }
        .cost { font-size: 0.85rem; color: #7d8590; }
        
        button { background: #238636; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }
        button.prestige { background: #8957e5; margin-top: 20px; width: 100%; padding: 15px; font-size: 1.1rem; }

        .multiplier-tag { color: #f85149; font-weight: bold; }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="stats-bar">CURRENT INSTANCES</div>
        <div class="currency-main" id="sean-count">0</div>
        <div class="stats-bar">
            Network Throughput: <span id="sps-rate">0</span> Seans/sec | 
            Compute Multiplier: <span id="mult-display" class="multiplier-tag">1.0x</span>
        </div>
    </div>
