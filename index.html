<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperExcitingAndNormal Idle</title>
    <style>
        :root { --accent: #4ecca3; --bg: #1a1a2e; --panel: #16213e; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; overflow-x: hidden; }
        
        /* Egg Styling */
        #egg-container { text-align: center; cursor: pointer; transition: transform 0.1s; position: relative; }
        #egg-container:active { transform: scale(0.95); }
        .egg { width: 200px; height: 260px; background: #e0e0e0; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; display: flex; align-items: center; justify-content: center; border: 4px solid #bdc3c7; box-shadow: inset -10px -10px 20px rgba(0,0,0,0.1); }
        .egg-text { color: #333; font-weight: bold; font-size: 14px; text-align: center; padding: 20px; pointer-events: none; }

        /* Game Elements (Hidden Initially) */
        #game-ui { display: none; text-align: center; width: 100%; max-width: 500px; }
        .sean-main { width: 200px; height: 200px; border-radius: 50%; border: 5px solid var(--accent); cursor: pointer; object-fit: cover; margin-bottom: 20px; }
        
        .currency-box { background: var(--panel); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #0f3460; }
        .shop-item { background: var(--panel); border: 1px solid #0f3460; padding: 15px; margin: 10px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        button { background: var(--accent); border: none; padding: 10px 20px; border-radius: 5px; color: #1a1a2e; font-weight: bold; cursor: pointer; }
        button:disabled { background: #555; color: #888; cursor: not-allowed; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="egg-container" onclick="handleEggClick()">
        <div class="egg">
            <div class="egg-text">SuperExcitingAndNormal Idle</div>
        </div>
        <p id="egg-hint" style="color: #555; margin-top: 15px;">Click to interact</p>
    </div>

    <div id="game-ui">
        <h1 style="letter-spacing: 2px;">S.E.A.N. NETWORK</h1>
        
        <div class="currency-box">
            <img src="sean.png" class="sean-main" onclick="handleSeanClick()" alt="The Core">
            <h2 id="bux-count">0 SeanBux</h2>
            <p style="color: var(--accent)">SPS: <span id="sps-rate">0</span></p>
        </div>

        <div id="shop">
            <div class="shop-item">
                <div style="text-align: left;">
                    <strong>Local Connection</strong><br>
                    <small>+1 SeanBux/sec</small>
                </div>
                <button onclick="buyUpgrade(0)" id="btn0">Cost: 15</button>
            </div>
            <div class="shop-item">
                <div style="text-align: left;">
                    <strong>Server Integration</strong><br>
                    <small>+8 SeanBux/sec</small>
                </div>
                <button onclick="buyUpgrade(1)" id="btn1">Cost: 100</button>
            </div>
        </div>
    </div>

    <script>
        let eggClicks = 0;
        const HATCH_THRESHOLD = 10;
        let seanBux = 0;
        let sps = 0;

        const upgrades = [
            { cost: 15, power: 1 },
            { cost: 100, power: 8 }
        ];

        function handleEggClick() {
            eggClicks++;
            // Add a little shake effect
            document.getElementById('egg-container').style.transform = `rotate(${Math.sin(eggClicks) * 5}deg)`;
            
            if (eggClicks >= HATCH_THRESHOLD) {
                document.getElementById('egg-container').classList.add('hidden');
                document.getElementById('game-ui').style.display = 'block';
            }
        }

        function handleSeanClick() {
            seanBux++;
            updateDisplay();
        }

        function buyUpgrade(index) {
            let u = upgrades[index];
            if (seanBux >= u.cost) {
                seanBux -= u.cost;
                sps += u.power;
                u.cost = Math.floor(u.cost * 1.2);
                updateDisplay();
            }
        }

        function updateDisplay() {
            document.getElementById('bux-count').innerText = `${Math.floor(seanBux)} SeanBux`;
            document.getElementById('sps-rate').innerText = sps.toFixed(1);
            upgrades.forEach((u, i) => {
                const btn = document.getElementById(`btn${i}`);
                btn.innerText = `Cost: ${u.cost}`;
                btn.disabled = seanBux < u.cost;
            });
        }

        // Game Loop
        setInterval(() => {
            if (eggClicks >= HATCH_THRESHOLD) {
                seanBux += (sps / 10);
                updateDisplay();
            }
        }, 100);
    </script>
</body>
</html>
